apiVersion: v1
kind: AlertmanagerConfig
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: "email"
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
    receivers:
      - name: "email"
        email_configs:
          - to: "yaakovsm@gmail.com"
            from: "yaakovsm@gmail.com"
            smarthost: "smtp.gmail.com:587"
            auth_username: "yaakovsm@gmail.com"
            auth_identity: "yaakovsm@gmail.com"
            auth_password: 
              name: gmail-auth
              key: password